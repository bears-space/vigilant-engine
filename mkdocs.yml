site_name: Vigilant Engine Documentation
site_description: Documentation for the Vigilant Engine ESP-IDF framework
site_dir: site
repo_name: GitHub
repo_url: https://github.com/bears-space/vigilant-engine

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Build & Flash: build-flash.md
  - Project Layout: project-layout.md
  - Firmware Features: features.md
  - Telemetry Pipeline: telemetry-pipeline.md
  - Configuration: config.md
  - Recovery & OTA: recovery-ota.md
  - Peripherals: peripherals.md
  - I2C Interface: i2c-interface.md
  - Troubleshooting: troubleshooting.md
  - Reference:
      - Partition Table: partitions.md
      - Flash Helper: flash-helper.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search
  - mermaid2

hooks:
  - docs/mkdocs_hooks.py

watch:
  - docs/mkdocs_hooks.py
  - docs/overrides/

theme:
  name: readthedocs
  custom_dir: docs/overrides
