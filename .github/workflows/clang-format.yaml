name: clang-format

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: [self-hosted, linux, x64, docker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          [ -s .python-version ] || { echo ".python-version file is missing or empty in the repository root" >&2; exit 1; }
          PYTHON_VERSION="$(cat .python-version)"
          uv python install "${PYTHON_VERSION}"
          uv sync --dev --python "${PYTHON_VERSION}"

      - name: Check C and C++ formatting
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.c' '*.h' '*.cc' '*.cpp' '*.cxx' '*.hpp' '*.hh' '*.hxx')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C/C++ files found to check."
            exit 0
          fi

          uv run clang-format --dry-run --Werror --style=file "${files[@]}"
