name: Unity unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure host tests
        run: cmake -S tests/host -B build/tests-host -DCMAKE_BUILD_TYPE=Debug -DVE_TEST_SANITIZERS=ON
      - name: Build host tests
        run: cmake --build build/tests-host --parallel
      - name: Run Unity tests
        run: ctest --test-dir build/tests-host --output-on-failure --no-tests=error
